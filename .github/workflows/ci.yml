name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet
        run: go vet ./...

      # unit tests only; live mysql/postgres behavior is covered end to end
      # by the integration suite in the genigo repository
      - name: Test
        run: go test -v ./...
